services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: ce-graph-falkordb
    restart: unless-stopped
    ports:
      - "6379:6379"   # graph wire protocol (Redis-compatible)
      - "3000:3000"   # FalkorDB Browser UI -- visit http://localhost:3000
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  falkordb_data:
    name: ce_graph_falkordb_data
