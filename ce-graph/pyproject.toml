[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ce-graph"
version = "0.1.0"
description = "Knowledge graph layer for the CE-AGENTS monorepo (Graphiti + FalkorDB)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "ce-shared @ file:../ce-shared",
    "graphiti-core[falkordb]>=0.28.0",
    "falkordb>=1.5.0",
    "pydantic>=2.5",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
]
backfill = [
    "notion-client>=2.2",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[project.scripts]
cegraph = "ce_graph.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ce_graph"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires running FalkorDB instance",
]
