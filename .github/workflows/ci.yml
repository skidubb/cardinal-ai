name: CE AGENTS CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  doc-drift:
    name: Doc Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install anthropic pyyaml httpx || true
      - run: python Scripts/check-doc-drift.py

  shared-packages:
    name: Shared Packages — Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      # stepwise with cd — ce-db/ce-graph declare `ce-shared @ file:../ce-shared`,
      # which pip resolves relative to the CWD
      - run: pip install -e ./ce-shared pytest
      - run: cd ce-db && pip install -e .
      - run: cd ce-graph && pip install -e .
      - run: pytest ce-shared/tests ce-db/tests ce-graph/tests -v --tb=short -m "not integration"

  portal-typecheck:
    name: Portal — Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cardinal-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: 'cardinal-portal/package-lock.json' }
      - run: npm ci
      - run: npx tsc --noEmit

  agent-builder-lint:
    name: Agent Builder — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CE - Agent Builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: 'CE - Agent Builder/pyproject.toml' }
      - run: pip install -e ".[dev,sdk]"
      - run: ruff check src/csuite
      - run: mypy src/csuite --ignore-missing-imports

  agent-builder-test:
    name: Agent Builder — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CE - Agent Builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: 'CE - Agent Builder/pyproject.toml' }
      - run: pip install -e ".[dev,sdk]"
      - run: pytest tests/ -v --tb=short -m "not integration"
        env:
          ANTHROPIC_API_KEY: sk-test-placeholder

  orchestration-lint:
    name: Orchestration — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CE - Multi-Agent Orchestration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: 'CE - Multi-Agent Orchestration/requirements.txt' }
      - run: pip install -r requirements.txt && pip install ruff
      - run: ruff check protocols/ api/ --ignore E402

  orchestration-test:
    name: Orchestration — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CE - Multi-Agent Orchestration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: 'CE - Multi-Agent Orchestration/requirements.txt' }
      - run: pip install -r requirements.txt && pip install pytest pytest-asyncio fastapi httpx sqlmodel sse-starlette litellm
      - run: pytest tests/ -v --tb=short -m "not integration"
        env:
          ANTHROPIC_API_KEY: sk-test-placeholder

  orchestration-ui:
    name: Orchestration — UI Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CE - Multi-Agent Orchestration/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: 'CE - Multi-Agent Orchestration/ui/package-lock.json' }
      - run: npm ci
      - run: npx vite build

  evals-test:
    name: Evals — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CE - Evals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v
