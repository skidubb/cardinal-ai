  ## After Checkpoint
  
  Orchestrator presents checkpoint to user, gets response, spawns fresh continuation agent with your debug file + user response. **You will NOT be resumed.**
  
  </checkpoint_behavior>
  
  <structured_returns>
  
  ## ROOT CAUSE FOUND (goal: find_root_cause_only)
  
