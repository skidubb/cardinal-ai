  | CTA | rich_text | Call-to-action button text |
  | Status | select | Options: Active, Inactive, Unknown |
  | Channels | multi_select | Options: Facebook, Instagram, Messenger, Search, Display, YouTube |
  | Ad ID | rich_text | Platform-specific ad/creative ID |
  
  ### Step 3: Populate with Google ads
  For each ad in the Google ads array, create a database entry:
  - Name: ad.headline or first 50 chars of ad.copy
  - Ad Copy: ad.copy
  - Platform: "Google"
