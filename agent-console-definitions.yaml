  | Criterion | [A] | [B] | [C] |
  |-----------|-----|-----|-----|
  | [criterion 1] | [rating/value] | [rating/value] | [rating/value] |
  
  ## Detailed Analysis
  
  ### [Option A]
  **Strengths:**
  - [strength 1]
  - [strength 2]
  
  **Weaknesses:**
  - [weakness 1]
  
