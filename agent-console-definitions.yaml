  Reference full template: `/Users/scottewalt/.claude/get-shit-done/templates/roadmap.md`
  
  ## STATE.md Structure
  
  Use template from `/Users/scottewalt/.claude/get-shit-done/templates/state.md`.
  
  Key sections:
