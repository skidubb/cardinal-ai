  You can read and write to the CE Notion workspace via MCP.
  - Use `notion-search` to find existing competitive intelligence databases
  - Use `notion-create-pages` to store scraped ad data
  - Use `notion-update-page` to update existing entries
  
  ## Input Parameters
  
  Parse the user's request to extract:
  - `company_name` (required): The company/brand name to search for
  - `ad_limit` (optional, default: 50): Maximum ads to scrape per platform
  - `platforms` (optional, default: "both"): Which platforms to scrape - "google", "meta", or "both"
  
  ---
  
  ## Orchestration Flow
  
  Execute these steps in order:
  
  ### Step 1: Parse Input
  Extract company_name, ad_limit, and platforms from the user's request. If company_name is not provided, ask the user for it.
  
  ### Step 2: Load Required Tools
  Before scraping, load the Puppeteer MCP tools needed for browser automation:
  ```
  Use ToolSearch to load:
  - mcp__puppeteer__puppeteer_navigate
  - mcp__puppeteer__puppeteer_screenshot
  - mcp__puppeteer__puppeteer_fill
  - mcp__puppeteer__puppeteer_click
  - mcp__puppeteer__puppeteer_evaluate
  ```
  
  ### Step 3: Scrape Google Ads (if platforms includes "google" or "both")
  Launch the Google Ads Scraper subagent using the Task tool:
  
  ```
  Task tool parameters:
  - subagent_type: "general-purpose"
  - description: "Scrape Google Ads for {company_name}"
  - prompt: See GOOGLE_ADS_SCRAPER_PROMPT below
  ```
  
  ### Step 4: Scrape Meta Ads (if platforms includes "meta" or "both")
  Launch the Meta Ads Scraper subagent using the Task tool:
  
  ```
  Task tool parameters:
  - subagent_type: "general-purpose"
  - description: "Scrape Meta Ads for {company_name}"
  - prompt: See META_ADS_SCRAPER_PROMPT below
  ```
  
  **IMPORTANT**: If scraping both platforms, launch Steps 3 and 4 in PARALLEL using multiple Task tool calls in a single message.
  
  ### Step 5: Merge Results
  Combine the results from both scrapers into a unified format:
  ```json
  {
    "company_name": "...",
    "google_ads": [...],
    "meta_ads": [...],
    "total_ads": 85,
    "scrape_date": "2026-01-24"
  }
  ```
  
  ### Step 6: Write to Notion
  Launch the Notion Ads Writer subagent using the Task tool:
  
  ```
  Task tool parameters:
  - subagent_type: "general-purpose"
  - description: "Write ads to Notion for {company_name}"
  - prompt: See NOTION_ADS_WRITER_PROMPT below
  ```
  
  ### Step 7: Return Summary
  Provide the user with:
  - Number of ads found per platform
  - Notion page URL
  - Any errors or warnings encountered
  
  ---
  
  ## Subagent Prompts
  
  ### GOOGLE_ADS_SCRAPER_PROMPT
  
  ```
  You are scraping Google Ads Transparency Center for competitive ad intelligence.
  
  **Company to search**: {company_name}
  **Max ads to scrape**: {ad_limit}
  **Output folder**: /Users/scottewalt/Documents/Competitive - Ads
  
  ## Required Tools
  First, use ToolSearch to load these Puppeteer tools:
  - mcp__puppeteer__puppeteer_navigate
  - mcp__puppeteer__puppeteer_screenshot
  - mcp__puppeteer__puppeteer_fill
  - mcp__puppeteer__puppeteer_click
  - mcp__puppeteer__puppeteer_evaluate
  
  ## Scraping Steps
  
  1. **Navigate to Google Ads Transparency Center**
     - Use puppeteer_navigate to go to: https://adstransparency.google.com
     - Take a screenshot to verify the page loaded
  
  2. **Search for the company**
     - Use puppeteer_evaluate to find and interact with the search input
     - The search box typically has a placeholder like "Search for an advertiser"
     - Type the company name and submit the search
     - Wait 3 seconds for results to load
  
  3. **Select the advertiser**
     - Use puppeteer_evaluate to check for matching advertiser results
     - Click on the most relevant match (exact name match preferred)
     - If no results found, return empty results with error message
  
  4. **Scrape ad listings**
     - Use puppeteer_evaluate to extract ad cards from the page
     - For each ad, extract:
       - headline: Main ad title/headline text
       - copy: Body text/description
       - format: "Text", "Image", or "Video" (infer from creative type)
       - last_shown: Date the ad was last shown
       - landing_url: Destination URL if visible
       - creative_id: Any unique identifier shown
     - Scroll down to load more ads if needed (up to ad_limit)
     - Add 2-3 second delays between scroll actions to avoid rate limiting
  
  5. **Take screenshots**
     - Take a screenshot of each unique ad format found
     - Save to output folder with naming: google_{company_name}_{index}.png
  
  ## Output Format
  Return a JSON object with this structure:
  ```json
  {
    "platform": "google",
    "advertiser_name": "Actual advertiser name found",
    "advertiser_verified": true,
    "ads_count": 25,
    "ads": [
      {
        "headline": "Ad headline text",
        "copy": "Ad body copy text",
        "format": "Image",
        "last_shown": "2026-01-20",
        "landing_url": "https://example.com/landing",
        "creative_id": "CR123456"
      }
    ],
    "errors": [],
    "scrape_timestamp": "2026-01-24T10:30:00Z"
  }
  ```
  
  ## Error Handling
  - If the advertiser is not found, return: {"platform": "google", "advertiser_name": null, "ads": [], "errors": ["Advertiser not found"]}
  - If rate limited, wait 10 seconds and retry once
  - If page structure changed, document what you see and return partial results
  - Always include any errors in the errors array
  
  ## Rate Limiting
  - Wait 2-3 seconds between page actions
  - Wait 3-5 seconds after search before scraping results
  - If you encounter a CAPTCHA, stop and report it in errors
  ```
  
  ### META_ADS_SCRAPER_PROMPT
  
  ```
  You are scraping Meta Ad Library for competitive ad intelligence.
  
  **Company to search**: {company_name}
