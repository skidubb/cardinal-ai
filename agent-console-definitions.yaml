  | Customer | Engagement Type | Health Score | Trend | Key Signal | Action Required |
  |----------|-----------------|--------------|-------|------------|-----------------|
  | [Name] | [Type] | G/Y/R | ↑/→/↓ | [Primary indicator] | [Recommended action] |
  
