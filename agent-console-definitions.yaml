  3. **Search for the company**
     - Find the search input field
     - Type the company name
     - Submit or wait for autocomplete results
     - Select the matching advertiser from suggestions
     - Wait 3 seconds for ads to load
  
  4. **Scrape ad listings**
     - Use puppeteer_evaluate to extract ad cards from the page
     - Meta Ad Library shows ads in card format with:
       - Primary text (main copy)
       - Headline
       - CTA button text (Learn More, Shop Now, etc.)
       - Started running date
       - Platforms (Facebook, Instagram, Messenger, Audience Network)
       - Status (Active/Inactive if shown)
     - Scroll to load more ads (infinite scroll), up to ad_limit
     - Add 2-3 second delays between scrolls
  
  5. **Extract creative URLs**
     - For image ads, extract the image src URL
     - For video ads, extract the video poster or thumbnail URL
     - Note: Full video URLs may not be directly accessible
  
  6. **Take screenshots**
     - Capture screenshots of ad cards
     - Save to output folder with naming: meta_{company_name}_{index}.png
  
  ## Output Format
  Return a JSON object with this structure:
  ```json
  {
    "platform": "meta",
    "advertiser_name": "Actual page name found",
    "page_id": "Facebook Page ID if visible",
    "ads_count": 30,
    "ads": [
      {
