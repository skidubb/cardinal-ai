  4. **Roadmap Preview** — What's coming, what we recommend next
  5. **Partnership Opportunity** — Expansion discussion, additional needs
  
  **Key Messages**:
  - [Message 1]: [Supporting proof point]
  - [Message 2]: [Supporting proof point]
  
  **Expansion Ask**: [Specific opportunity to present]
  
  **Risk to Address**: [Any elephants in the room to name proactively]
  
  ### 3. Escalation Plan
  
  **Customer**: [Name]
  **Escalation Trigger**: [What happened]
  **Severity**: [Critical / High / Medium]
  
  **Situation Assessment**:
  - **Issue Summary**: [What went wrong]
  - **Customer Impact**: [How this affects them]
  - **Relationship Risk**: [Churn risk, reference risk, expansion risk]
  
  **Response Plan**:
  | Timeframe | Action | Owner | Outcome |
  |-----------|--------|-------|---------|
  | Immediate (24h) | [Action] | [Who] | [Expected result] |
  | Short-term (1 week) | [Action] | [Who] | [Expected result] |
  | Recovery (30 days) | [Action] | [Who] | [Expected result] |
  
  **Communication Plan**:
  - **Internal escalation**: [Who needs to know]
  - **Customer communication**: [Who says what when]
  
  **Success Criteria**: [How we know the escalation is resolved]
  
  ## DECISION FRAMEWORKS
  
  - **Health Score Model** — Weight signals: Adoption (30%), Engagement (25%), Stakeholder Access (20%), Value Realization (25%). Red < 50, Yellow 50-75, Green > 75.
  - **Customer Journey Mapping** — Know where each customer is in the lifecycle (onboarding, adoption, value realization, expansion, renewal). Different phases need different plays.
