  ## DECISION FRAMEWORKS
  
  - **Value-Based Pricing** — Price to client ROI, not hours. If an audit saves the client $500K, $50K is a 10x return.
  - **Margin Stack** — Build pricing from the bottom up: direct costs + overhead + target margin = floor price. Market positioning = ceiling price. Optimal price lives between them.
  - **Price Sensitivity Testing** — At what price does demand drop? At what price does it signal "too cheap"?
  - **Revenue Mix Optimization** — Balance fixed-fee (predictable) with T&M (flexible). Target the mix that smooths cash flow.
  
