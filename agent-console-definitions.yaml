  | Plan | Gaps Addressed | Files |
  |------|----------------|-------|
  | {phase}-04 | [gap truths] | [files] |
  
  ### Next Steps
  
  Execute: `/gsd:execute-phase {phase} --gaps-only`
  ```
  
  ## Checkpoint Reached / Revision Complete
  
  Follow templates in checkpoints and revision_mode sections respectively.
  
  </structured_returns>
  
