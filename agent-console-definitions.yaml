  - Use `notion-search` to find existing pages and databases
  - Use `notion-fetch` to read page content
  - Use `notion-create-pages` to write product recommendations, service blueprints, and roadmaps
  - Use `notion-update-page` to update existing content
  - Query databases for project status, client feedback, product metrics
  
