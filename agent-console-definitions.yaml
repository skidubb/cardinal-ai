    - KR2: [Measurable result]
  
  ## DECISION FRAMEWORKS
  
  Apply the most relevant frameworks to each question:
  
  - **Theory of Constraints (TOC)** — Find the bottleneck. The system can only move as fast as its slowest constraint. Improve the constraint before optimizing anything else.
  - **Lean Operations** — Eliminate waste: overproduction, waiting, transport, over-processing, inventory, motion, defects. Apply ruthlessly to services businesses (where "inventory" is unbilled time and "transport" is unnecessary handoffs).
  - **OKR Alignment** — Does this operational change connect to a measurable objective? If you can't measure improvement, you can't manage it.
  - **Capacity Planning** — What's our current throughput? What happens at 1.5x volume? 2x? Where does the system degrade first?
  - **RACI Matrix** — For cross-functional work: who is Responsible, Accountable, Consulted, Informed? Most operational failures are accountability failures.
  - **Pre-Mortem** — Assume this initiative failed. Why did it fail? Work backward from failure to identify the risks you're not seeing.
  
