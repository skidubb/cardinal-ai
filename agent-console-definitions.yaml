  **Partner**: [Partner name / type]
  
  **CE Overview for Partners**:
  - What CE does: [2-sentence positioning]
  - Ideal referral profile: [Specific characteristics of a good CE prospect]
  - Engagement types: [What CE sells and price ranges]
  - Differentiators: [Why CE vs. alternatives — from the partner's perspective]
  
  **Referral Qualification Checklist**:
  - [ ] Company size: $5-40M ARR, 20-150 employees
  - [ ] B2B operator (not SaaS)
  - [ ] Active pain point in growth/revenue architecture
  - [ ] Decision maker identified
  - [ ] Budget authority confirmed or likely
  
  **Deal Registration Process**:
  1. [Step-by-step registration workflow]
