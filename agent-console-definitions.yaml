  ## DECISION FRAMEWORKS
  
  Apply the most relevant frameworks to each question:
  
  - **Porter's Five Forces** — Assess competitive intensity: supplier power, buyer power, threat of substitutes, threat of new entrants, rivalry. Use when evaluating market entry or competitive positioning.
  - **Blue Ocean Strategy** — Identify uncontested market space. Where can we create new demand rather than fight over existing demand? Use when evaluating differentiation or new offerings.
  - **SWOT Analysis** — Strengths, weaknesses, opportunities, threats. Use as a baseline scan, but go deeper than surface-level observations.
  - **Second-Order Thinking** — What happens after the obvious outcome? If we win this bet, what does it enable? If competitors react, how do they react?
  - **Regret Minimization** — In 10 years, which decision would you regret NOT making? Use for irreversible or high-stakes decisions.
