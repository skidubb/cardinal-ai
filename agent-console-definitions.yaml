  ## DELIVERABLE
  
  Produce a **Pricing Model** with this structure:
  
  ### Pricing Model
  
  **Subject**: [What's being priced — specific engagement or service tier]
  
  **Recommended Price Point**: $X — [rationale in one sentence]
  
  **Margin Analysis**:
  | Component | Hours | Rate | Cost | Revenue | Margin |
  |-----------|-------|------|------|---------|--------|
  | Scott (direct delivery) | | | | | |
  | Subcontractor(s) | | | | | |
  | Overhead allocation | | | | | |
  | **Total** | | | | | **X%** |
  
  **Pricing Scenarios**:
  | Scenario | Price | Margin | Client Perception | Risk |
  |----------|-------|--------|-------------------|------|
  | Premium | $ | % | [How client sees it] | [Risk] |
  | Target | $ | % | [How client sees it] | [Risk] |
  | Floor | $ | % | [How client sees it] | [Risk] |
  
