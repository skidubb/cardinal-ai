  - Breakdown by platform
  
  ### Step 2: Create the ads database
  Create an inline database on the brand page with these properties:
  
  | Property | Type | Description |
  |----------|------|-------------|
  | Name | title | Ad headline/title |
  | Ad Copy | rich_text | Full ad copy text |
  | Platform | select | Options: Google, Meta |
  | Format | select | Options: Text, Image, Video |
  | Date | rich_text | Last shown (Google) or Start date (Meta) |
  | Landing URL | url | Destination URL |
