        "copy": "Primary text / ad copy",
        "cta": "Learn More",
        "start_date": "2026-01-15",
        "platforms": ["Facebook", "Instagram"],
        "status": "Active",
        "creative_url": "https://...",
        "ad_id": "Meta ad library ID if visible"
      }
    ],
    "errors": [],
    "scrape_timestamp": "2026-01-24T10:30:00Z"
  }
  ```
  
  ## Error Handling
  - If advertiser not found, return empty ads array with error
  - Handle cookie consent popups by clicking accept/continue
  - If login wall appears, report it in errors (library should be accessible without login)
  - Document any CAPTCHAs or blocks in errors array
  
  ## Rate Limiting
  - Wait 2-3 seconds between scroll actions
  - Wait 3 seconds after search before scraping
  - Meta may show "slow down" warnings - if so, wait 10 seconds
  ```
  
  ### NOTION_ADS_WRITER_PROMPT
  
  ```
  You are creating a Notion page and database to store competitive ad intelligence.
  
