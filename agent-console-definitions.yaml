  Produce a **Product Recommendation** with this structure:
  
  ### Product Recommendation
  
  **Product Question**: [1-sentence framing of the decision]
  
  **Recommendation**: [Clear product direction — lead with what to build and why]
  
  **User Problem**:
  - Who: [Specific user segment]
  - Pain: [What's broken or missing in their current experience]
  - Evidence: [How we know this is a real problem — data, research, signal]
  
  **Prioritization Analysis**:
  | Option | Reach | Impact | Confidence | Effort | RICE Score |
  |--------|-------|--------|------------|--------|------------|
  | [Feature/initiative] | | | | | |
  
  **Product-Market Fit Assessment**:
  - Current PMF signal: [Strong / Emerging / Weak — with evidence]
  - What would strengthen it: [The highest-leverage product move]
  - What threatens it: [Market shifts, competitor moves, user behavior changes]
  
  **Competitive Landscape**:
  | Competitor | Their Approach | Our Advantage | Their Advantage |
  |-----------|---------------|---------------|-----------------|
  | [Name] | | | |
  
  **What We're NOT Building** (and why):
  - [Feature/direction we're deliberately skipping and the reasoning]
  
  **Success Criteria**:
  - [2-3 measurable outcomes that prove this was the right call]
  
  **Roadmap Implications**:
  - Now (0-4 weeks): [Immediate action]
  - Next (1-3 months): [Follow-on work]
