  | Rate limit delay | 2-3 seconds between actions |
  
  ---
  
  ## Important: Generic Agent Design
  
  **This agent works for ANY company name.** The `company_name` parameter is fully dynamic - simply provide any company/brand name and the agent will search for their ads across platforms. There are no hardcoded company names.
  
  ---
  
  ## Example Usage
  
  The agent accepts ANY company name. Here are example invocations:
  
  ### Large Consumer Brand
  ```
  @competitive-ads Get competitive ads for Nike
  ```
  Response: "Found 150 Google ads and 200 Meta ads for Nike. View in Notion: [link]"
  
  ### B2B SaaS Company
  ```
  @competitive-ads Analyze HubSpot's ads, limit 25
  ```
  Response: "Found 25 Google ads and 25 Meta ads for HubSpot. View in Notion: [link]"
  
  ### E-commerce Platform
  ```
  @competitive-ads Scrape Shopify ads from meta only
  ```
  Response: "Found 75 Meta ads for Shopify (Google skipped). View in Notion: [link]"
  
  ### Enterprise Software
  ```
  @competitive-ads Get Salesforce ads, google only, limit 100
  ```
  Response: "Found 100 Google ads for Salesforce (Meta skipped). View in Notion: [link]"
  
  ### Small/Local Business
  ```
  @competitive-ads Get competitive ads for "Joe's Coffee Shop Seattle"
  ```
  Response: "No ads found for Joe's Coffee Shop Seattle on either platform."
  
  ### Internal Flow (for any company)
  1. Parse: company_name="{user_input}", ad_limit=50, platforms="both"
  2. Launch Google scraper (Task tool)
  3. Launch Meta scraper (Task tool) - in parallel with step 2
  4. Merge results when both complete
  5. Launch Notion writer with merged data
  6. Return: "Found X Google ads and Y Meta ads for {company_name}. View in Notion: [link]"
  
  ---
  
  ## Error Scenarios
  
  ### Company not found on one platform
  - Continue with the other platform
  - Note the missing platform in the summary
  - Still create Notion page with available data
  
  ### Rate limiting or blocking
  - Wait and retry once (10 second delay)
  - If still blocked, return partial results
  - Document the block in errors
  
  ### Empty results
  - If no ads found on either platform:
    - Verify the company name spelling
    - Suggest alternative search terms
    - Create Notion page with "No ads found" note
  
  ---
  
  ## Verification Checklist
  
  ### General Verification (after any run)
  - [ ] Google scraper returned valid JSON with ads array
  - [ ] Meta scraper returned valid JSON with ads array
  - [ ] Notion page created with correct company title (dynamic)
  - [ ] Database has all required columns
  - [ ] Ads from both platforms appear in database
  - [ ] No duplicate ads
  - [ ] URLs are valid and clickable
  
  ### Test with Multiple Company Types
  
  **1. Large Advertiser (e.g., "Nike", "Shopify")**
  - Should return many ads from both platforms
  - Verifies pagination and scrolling work correctly
  - Expected: 50+ ads per platform
  
  **2. B2B Company (e.g., "Salesforce", "HubSpot")**
  - Different ad styles (whitepapers, demos, webinars)
  - Verifies varied content extraction
  - Expected: 20-50 ads per platform
  
  **3. Small/Local Business (any local company)**
  - May return few or no ads
  - Verifies graceful handling of "not found" scenarios
  - Expected: 0-10 ads, or "not found" message
  
  **4. Company with Special Characters (e.g., "Ben & Jerry's")**
  - Verifies URL encoding and search handling
  - Expected: Should find ads if they exist
  
  ### Edge Cases to Test
  - [ ] Company not found on one platform (should continue with other)
  - [ ] Company not found on either platform (should report clearly)
  - [ ] Rate limiting / blocking (should retry once, then report)
  - [ ] Empty results (should create Notion page noting "no ads found")
  - [ ] Company name with special characters (& ' " etc.)
  - [ ] Very long company name (should truncate appropriately)
