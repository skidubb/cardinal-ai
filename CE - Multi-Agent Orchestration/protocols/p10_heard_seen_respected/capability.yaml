protocol_id: P10
name: Heard Seen Respected
category: Liberating Structures
problem_types:
- Multi-Stakeholder
cost_tier: medium
min_agents: 2
max_agents: null
supports_rounds: false
description: Deep listening protocol — surface experiences and perspectives before
  solutions.
when_to_use: Stakeholder alignment, empathy-building before decisions.
when_not_to_use: Urgent decisions, quantitative analysis.
tools_enabled: true

stages:
  - name: "Phase 1 — Share narratives"
    produces: narratives
    kind: agent
    required: true
    summary_role: working_notes
    description: "Each stakeholder shares their experience as a first-person narrative"
  - name: "Phase 2 — Reflect back"
    produces: reflections
    kind: agent
    required: true
    summary_role: working_notes
    description: "Paired reflections — each participant mirrors what they heard from another"
  - name: "Phase 3 — Bridge synthesis"
    produces: [common_ground, key_differences, translation_guide]
    kind: synthesis
    required: true
    summary_role: primary_summary
    description: "Surface common ground, key differences, and a translation guide across perspectives"
