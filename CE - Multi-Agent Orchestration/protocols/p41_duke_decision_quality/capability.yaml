protocol_id: P41
name: Duke Decision Quality
category: Wave 2 Research
problem_types:
- General Analysis
- Estimation
cost_tier: medium
min_agents: 2
max_agents: null
supports_rounds: false
description: Annie Duke framework — separate decision quality from outcome quality.
when_to_use: Evaluating decision processes, not just outcomes.
when_not_to_use: Simple factual questions, creative brainstorming.
tools_enabled: true

stages:
  - name: "Dimension scoring"
    produces: [scores, justifications]
    kind: agent
    required: true
    summary_role: structured_prelude
    description: "Agents score the decision on Duke's six dimensions (information, alternatives, values, logic, commitment, outcomes)"
  - name: "Quality assessment"
    produces: [overall_score, assessment, reasoning]
    kind: synthesis
    required: true
    summary_role: primary_summary
    description: "Aggregate dimension scores into an overall decision-quality assessment"
