protocol_id: P23
name: Cynefin Probe-Sense-Respond
category: Org Theory
problem_types:
- Diagnostic
- Systems Analysis
cost_tier: high
min_agents: 2
max_agents: null
supports_rounds: false
description: Classify complexity domain, then probe/sense/respond appropriately.
when_to_use: Uncertain situations needing complexity-aware approach.
when_not_to_use: Clear-cut decisions with known best practices.
tools_enabled: true

stages:
  - name: "Classify Cynefin domain"
    produces: [domain_votes, domain_responses]
    kind: agent
    required: true
    summary_role: working_notes
    description: "Each agent classifies the situation into one of Clear / Complicated / Complex / Chaotic"
  - name: "Consensus + contest detection"
    produces: [consensus_domain, was_contested]
    kind: mechanical
    required: true
    summary_role: structured_prelude
    description: "Tally domain votes; flag when agents disagreed"
  - name: "Domain-appropriate action plan"
    produces: action_plan
    kind: synthesis
    required: true
    summary_role: primary_summary
    description: "Produce a domain-appropriate response (best practice / analysis / probe / stabilize)"
